name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        run: |
          # Extract the release version from libs.versions.toml
          # Assuming it's in the [versions] section as app-version-release-{major,minor,patch} = "..."
          MAJOR=$(grep 'app-version-release-major' gradle/libs.versions.toml | cut -d'"' -f2 || echo "")
          MINOR=$(grep 'app-version-release-minor' gradle/libs.versions.toml | cut -d'"' -f2 || echo "")
          PATCH=$(grep 'app-version-release-patch' gradle/libs.versions.toml | cut -d'"' -f2 || echo "")

          TAG_NAME="${MAJOR}.${MINOR}.${PATCH}"

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not build a valid semver tag from 'app-version-release-*' in gradle/libs.versions.toml (got '$TAG_NAME'). Expected format: X.Y.Z (e.g. 2.2.0)"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup build tool version
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Assemble release APK
        run: ./gradlew :app-mobile:assembleRelease

      - name: Sign release APK
        id: sign_release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app-mobile/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Prepare artifact
        run: mv ${{ steps.sign_release.outputs.signedReleaseFile }} flixclusive-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flixclusive-release.apk

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Get previous stable tag for changelog
        run: |
          previous_tag=$(git --no-pager tag --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${{ needs.build.outputs.tag_name }}" | head -1 || echo "")
          echo "Found previous tag: $previous_tag"
          echo "previousTag=$previous_tag" >> $GITHUB_ENV

      - name: Generate changelogs
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fromTag: ${{ github.sha }}
          toTag: ${{ env.previousTag }}
          excludeTypes: 'build,docs,other,style,test,chore'
          writeToFile: true
          filename: 'CHANGELOG.md'

      - name: Truncate changelog if too long
        run: |
          MAX_BYTES=120000
          SIZE=$(wc -c < CHANGELOG.md)

          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::warning::Changelog is $SIZE bytes, truncating to fit GitHub's 125000 character release body limit."
            head -c "$MAX_BYTES" CHANGELOG.md > CHANGELOG.truncated.md
            printf '\n\n---\n_Changelog truncated. See the full commit history for the remaining changes._\n' >> CHANGELOG.truncated.md
            mv CHANGELOG.truncated.md CHANGELOG.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"

          # Delete existing release with same tag if re-running
          gh release delete "$TAG_NAME" --yes || echo "No existing release with tag $TAG_NAME."

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file CHANGELOG.md \
            --target "${{ github.sha }}" \
            flixclusive-release.apk

      - name: Push tag to source repository
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"

          git config user.name "flixclusiveorg"
          git config user.email "bot@flixclusive.app"

          # Overwrite the tag locally in case this run is a re-publish
          git tag -f "$TAG_NAME" "${{ github.sha }}"

          # Force-push so re-runs against the same version move the tag
          git push origin "$TAG_NAME" --force
